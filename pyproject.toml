[project]
name = "sbibm-jax"
version = "0.1.1"
description = "Simulation-Based Inference Benchmark — JAX rewrite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "fyeldgenerator>=0.1.7",
    "jax>=0.9.1",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "numpyro>=0.18.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
hf = [
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
]
loader = [
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
    "grain>=0.2.15",
]
pypesto = [
    "pypesto[amici]>=0.6.0",
    "petab",
    "benchmark-models-petab",
    "joblib",
    "scipy",
    # petab's linter (np.issubdtype on column dtypes) breaks on pandas 3.0's
    # default StringDtype; pin to the pandas 2.x line.
    "pandas<3.0",
]

[dependency-groups]
torch = [
    "pyro-ppl>=1.9.1",
    "torch>=2.9.1",
]
lint = [
    "flake8",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-mock",
    "pytest-env",
    "genbadge[all]",
    "junitparser",
]
notebooks = [
    "notebook>=7.5.4",
]
hf = [
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
]
loader = [
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
    "grain>=0.2.15",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "torch"},
    {include-group = "notebooks"},
    {include-group = "hf"},
    {include-group = "loader"},
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-n 2"
env = [
    "JAX_PLATFORMS=cpu",
]
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "experimental: marks tests as experimental",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
benchmark-models-petab = { git = "https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git", subdirectory = "src/python", rev = "master" }
