[project]
name = "sbibm-jax"
version = "0.1.0"
description = "Simulation-Based Inference Benchmark — JAX rewrite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "jax[cuda12]>=0.9.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "numpyro>=0.18.0",
    "pandas>=2.0.0",
]


[dependency-groups]
torch = [
    "pytest>=8.0.0",
    "torch>=2.9.1",
]
lint = [
    "flake8",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-mock",
    "pytest-env",
    "genbadge[all]",
    "junitparser",
]
docs = [
    "jupytext",
    "pandoc",
    "pydata-sphinx-theme",
    "sphinx",
    "myst-nb",
    "astroid>=3,<5", # fix for sphinx.autoapi and read the docs, should be reverted at a later date - see issue #2125
    "numpydoc",
    "linkify-it-py", # for link shortening
    "sphinxext-rediraffe",
    # TODO: unpin sphinx-sitemap once a solution is offered for https://github.com/jdillard/sphinx-sitemap/issues/109
    "sphinx-sitemap<2.7.0",
    "sphinx-autoapi>=3.0.0",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-togglebutton",
    "sphinxcontrib-mermaid",
    "sphinx-favicon>=1.0.1",
]

notebooks = [
    "notebook>=7.5.4",
]
dev = [
    {include-group = "lint"},
    {include-group = "torch"},
    {include-group = "test"},
    {include-group = "docs"},
    {include-group = "notebooks"},
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-n 2"
env = [
    "JAX_PLATFORMS=cpu"
]
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "experimental: marks tests as experimental",
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
