[project]
name = "sbibm-jax"
version = "0.1.0"
description = "Simulation-Based Inference Benchmark — JAX rewrite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "jax[cuda12]>=0.9.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "numpyro>=0.18.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sbibm_jax"]

[dependency-groups]
dev = [
    "notebook>=7.5.4",
    "pytest>=8.0.0",
    "torch>=2.9.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
