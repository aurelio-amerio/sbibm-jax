[project]
name = "sbibm-jax"
version = "0.1.2"
description = "Simulators and datasets for simulation-based inference benchmarks in JAX/NumPyro"
readme = "README.md"
authors = [{ name = "Aurelio Amerio", email = "dev@gensbi.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "simulation-based-inference",
    "sbi",
    "benchmark",
    "jax",
    "numpyro",
    "bayesian-inference",
    "datasets",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "blackjax>=1.6",
    "diffrax>=0.7.2",
    "healpy>=1.19.0",
    "jax>=0.9.1",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "numpyro>=0.18.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
hf = [
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
]
loader = [
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
    "grain>=0.2.15",
]
pypesto = [
    "pypesto[amici]>=0.6.0",
    "petab",
    "benchmark-models-petab",
    "joblib",
    "scipy",
    # petab's linter (np.issubdtype on column dtypes) breaks on pandas 3.0's
    # default StringDtype; pin to the pandas 2.x line.
    "pandas<3.0",
]

[project.urls]
Homepage = "https://github.com/aurelio-amerio/sbibm-jax"
Repository = "https://github.com/aurelio-amerio/sbibm-jax"
Issues = "https://github.com/aurelio-amerio/sbibm-jax/issues"

[dependency-groups]
torch = [
    "pyro-ppl>=1.9.1",
    "torch>=2.9.1",
]
lint = [
    "flake8",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-mock",
    "pytest-env",
    "genbadge[all]",
    "junitparser",
]
notebooks = [
    "notebook>=7.5.4",
]
hf = [
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
]
loader = [
    "datasets>=2.20.0",
    "huggingface_hub>=0.24.0",
    "grain>=0.2.15",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "torch"},
    {include-group = "notebooks"},
    {include-group = "hf"},
    {include-group = "loader"},
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-n 2"
env = [
    "JAX_PLATFORMS=cpu",
]
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "experimental: marks tests as experimental",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
benchmark-models-petab = { git = "https://github.com/Benchmarking-Initiative/Benchmark-Models-PEtab.git", subdirectory = "src/python", rev = "master" }
