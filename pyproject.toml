[project]
name = "sbibm-jax"
version = "0.1.0"
description = "Simulation-Based Inference Benchmark — JAX rewrite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffrax>=0.7.2",
    "jax[cuda12]>=0.9.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "numpyro>=0.18.0",
    "pandas>=2.0.0",
]

[dependency-groups]
torch = [
    "pyro-ppl>=1.9.1",
    "torch>=2.9.1",
]
lint = [
    "flake8",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-mock",
    "pytest-env",
    "genbadge[all]",
    "junitparser",
]
notebooks = [
    "notebook>=7.5.4",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "torch"},
    {include-group = "notebooks"},
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-n 2"
env = [
    "JAX_PLATFORMS=cpu",
]
testpaths = [
    "tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "experimental: marks tests as experimental",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]
